{# Grouped navigation list, shared by the desktop sidebar and the staff drawer on phones. #}
<nav aria-label="Main navigation">
  {% for group in sa_nav %}
    {% if group.heading %}<div class="sa-nav-group">{{ group.heading }}</div>{% endif %}
    <ul class="sa-nav">
      {% for item in group.items %}
      <li>
        <a class="sa-nav-link" href="{{ item.url }}"{% if item.current %} aria-current="page"{% endif %}><svg class="sa-i" aria-hidden="true" focusable="false"><use href="#i-{{ item.icon }}"/></svg>{{ item.label }}</a>
      </li>
      {% endfor %}
    </ul>
  {% endfor %}
</nav>
