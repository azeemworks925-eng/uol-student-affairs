{# Grouped navigation list, shared by the sidebar and the phone drawer. #}
<nav aria-label="Main navigation">
  {% for group in sa_nav %}
    {% if group.heading %}<div class="sa-nav-group"><span>{{ group.heading }}</span></div>{% endif %}
    <ul class="sa-nav">
      {% for item in group.items %}
      <li>
        <a class="sa-nav-link" href="{{ item.url }}" data-tip="{{ item.label }}"{% if item.current %} aria-current="page"{% endif %}><svg class="sa-i" aria-hidden="true" focusable="false"><use href="#i-{{ item.icon }}"/></svg><span class="sa-nav-text">{{ item.label }}</span></a>
      </li>
      {% endfor %}
    </ul>
  {% endfor %}
</nav>
