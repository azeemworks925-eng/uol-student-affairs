{# List / Cards toggle for the collection with data-view-key="{{ key }}". Remembered per page by static/js/app.js. #}
<div class="sa-view-toggle" role="group" aria-label="Choose a view" data-view-toggle="{{ key }}">
  <button type="button" data-view-choice="list" aria-pressed="true" title="List"><svg class="sa-i" aria-hidden="true" focusable="false"><use href="#i-list"/></svg><span class="visually-hidden">List</span></button>
  <button type="button" data-view-choice="cards" aria-pressed="false" title="Cards"><svg class="sa-i" aria-hidden="true" focusable="false"><use href="#i-grid"/></svg><span class="visually-hidden">Cards</span></button>
</div>
