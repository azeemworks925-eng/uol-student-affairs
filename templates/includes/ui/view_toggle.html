{# List / Cards segmented toggle for the collection with data-view-key="{{ key }}". default: list (default) | cards. Remembered per page by static/js/app.js. #}
<div class="sa-view-toggle sa-seg sa-seg--icons" role="group" aria-label="Choose a view" data-view-toggle="{{ key }}" data-seg>
  <button type="button" data-view-choice="list" aria-pressed="{% if default == 'cards' %}false{% else %}true{% endif %}" title="List"><svg class="sa-i" aria-hidden="true" focusable="false"><use href="#i-list"/></svg><span class="visually-hidden">List</span></button>
  <button type="button" data-view-choice="cards" aria-pressed="{% if default == 'cards' %}true{% else %}false{% endif %}" title="Cards"><svg class="sa-i" aria-hidden="true" focusable="false"><use href="#i-grid"/></svg><span class="visually-hidden">Cards</span></button>
</div>
