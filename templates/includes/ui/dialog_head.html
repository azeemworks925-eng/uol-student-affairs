{# Dialog header with a close button. title, id. #}
<div class="sa-dialog-head">
  <h2 class="sa-card-title" id="{{ id }}">{{ title }}</h2>
  <button type="button" class="sa-dialog-close" data-dialog-close aria-label="Close"><svg class="sa-i" aria-hidden="true" focusable="false"><use href="#i-x"/></svg></button>
</div>
