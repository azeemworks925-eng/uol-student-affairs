{# The status journey, on one line (it wraps only below 576px). #}
<ol class="sa-journey" aria-label="Where this complaint stands">
  {% for step in journey %}<li class="is-{{ step.state }}"{% if step.state == "current" %} aria-current="step"{% endif %}><span class="dot" aria-hidden="true"></span>{{ step.label }}</li>{% endfor %}
</ol>
