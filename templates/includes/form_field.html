{# One form field: visible label, field, help text and an error linked by aria-describedby (AccessibleErrorsMixin). #}
<div class="mb-3{% if wrapper_class %} {{ wrapper_class }}{% endif %}"{% if wrapper_attrs %} {{ wrapper_attrs }}{% endif %}>
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required and not hide_optional %} <span class="sa-muted fw-normal">(optional)</span>{% endif %}</label>
  {{ field }}
  {% if field.errors %}<div class="invalid-feedback" id="{{ field.id_for_label }}-error">{{ field.errors|join:" " }}</div>{% endif %}
  {% if field.help_text %}<div class="form-text" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</div>{% endif %}
</div>
